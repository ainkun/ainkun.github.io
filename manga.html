<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ainkun — Security Researcher. Manga from the Side Quests library.">
  <meta name="theme-color" content="#c3daf5"><title>Manga | ainkun — Security Researcher</title>
  <script src="shrine.js"></script>
  <link rel="icon" href="assets/logo-clean/ainkun-clean.png?v=2" type="image/png"><link rel="stylesheet" href="shrine.css">
  <link rel="stylesheet" href="manga.css">
  <link rel="stylesheet" href="credit-transition.css">
  <link rel="expect" href="#page-ready" blocking="render">
  <script src="credit-transition.js" defer></script>
</head>
<body class="manga-page" data-view="loading">
  <div class="shrine-scene" aria-hidden="true"></div>
  <aside class="theme-controls" aria-label="Time of day theme" hidden>
    <div class="theme-options" role="group" aria-label="Preview a scene">
      <button type="button" data-set-time="morning" aria-pressed="false" title="Morning · 朝">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Morning</span>
      </button>
      <button type="button" data-set-time="evening" aria-pressed="false" title="Evening · 夕暮れ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16h18M6 16a6 6 0 0 1 12 0M12 3v3M3 8l2 2m14 0 2-2M6 20h12"/></svg><span>Evening</span>
      </button>
      <button type="button" data-set-time="night" aria-pressed="false" title="Night · 夜">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/><path d="M18 3v4m-2-2h4"/></svg><span>Night</span>
      </button>
    </div>
    <div class="theme-meta"><button class="theme-auto" type="button" aria-pressed="true">Auto · Local</button><span class="theme-clock"></span></div>
  </aside>
  <span class="sr-only" id="theme-status" role="status" aria-live="polite"></span>
  <main id="main">
    <nav class="manga-top" aria-label="Back"><a class="shrine-back" href="side-quests.html#manga"><span aria-hidden="true">←</span> <span lang="ja">漫画</span><span class="back-en"> / LIBRARY</span></a></nav>
    <section class="series" id="series" aria-labelledby="series-title" hidden>
      <div class="series-card">
        <img class="series-cover" alt="" width="300" height="450">
        <div class="series-info">
          <p class="series-jp" lang="ja" hidden></p>
          <h1 id="series-title"></h1>
          <p class="series-meta"></p>
          <p class="series-summary" hidden></p>
          <p class="series-actions"><a class="button-ink series-start"><span lang="ja">読む</span> START READING <span aria-hidden="true">→</span></a><a class="button-ink is-quiet series-continue" hidden></a></p>
          <h2 class="series-chapters-title"><span lang="ja">目次</span> Chapters</h2>
          <ol class="series-chapters"></ol>
        </div>
      </div>
    </section>
    <section class="reader" id="reader" aria-label="Reader" hidden>
      <header class="reader-bar">
        <a class="reader-series"><span aria-hidden="true">←</span> <span class="reader-title"></span></a>
        <label class="reader-chapter"><span class="sr-only">Chapter</span><select></select></label>
        <span class="reader-count"></span>
        <button class="reader-mode" type="button" aria-pressed="false"></button>
      </header>
      <div class="reader-stage">
        <img class="reader-img" alt="">
        <button class="reader-zone is-left" type="button" tabindex="-1" aria-hidden="true"></button>
        <button class="reader-zone is-right" type="button" tabindex="-1" aria-hidden="true"></button>
      </div>
      <div class="reader-scroll" hidden></div>
      <div class="reader-end" hidden>
        <p class="reader-end-mark" lang="ja"></p>
        <p class="reader-end-text"></p>
        <p class="reader-end-actions"><a class="button-ink reader-next" hidden></a><a class="button-ink is-quiet" href="side-quests.html#manga"><span lang="ja">書庫</span> LIBRARY</a></p>
      </div>
      <nav class="reader-nav" aria-label="Pages">
        <button class="reader-turn is-left" type="button"></button>
        <div class="reader-progress" aria-hidden="true"><span></span></div>
        <button class="reader-turn is-right" type="button"></button>
      </nav>
    </section>
    <section class="manga-missing" hidden>
      <p class="manga-missing-mark" lang="ja">見つかりません</p>
      <p>This manga isn't in the library.</p>
      <a class="shrine-back" href="side-quests.html#manga"><span aria-hidden="true">←</span> <span lang="ja">漫画</span><span class="back-en"> / LIBRARY</span></a>
    </section>
  </main>
  <span class="sr-only" id="reader-status" role="status" aria-live="polite"></span>
  <footer><a class="creator-credit" href="https://pakcyberbot.com" data-creator-link>Created by PakCyberbot</a><span>© <span id="year"></span> ainkun</span><a href="index.html#home"><span lang="ja">またね</span> / SEE YOU AGAIN ↑</a></footer>
  <script>document.querySelector('#year').textContent = new Date().getFullYear();</script>
  <script src="quest-data.js"></script>
  <script src="manga.js"></script>
  <span id="page-ready" hidden></span>
</body>
</html>
