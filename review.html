  <link rel="icon" href="assets/logo-clean/ainkun-clean.png?v=2" type="image/png"><link rel="stylesheet" href="shrine.css">

</head>
<body data-post="reviews">
  <div class="shrine-scene" aria-hidden="true"></div>
  <div class="theme-controls" hidden>
    <button class="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-menu"><span class="theme-now" aria-hidden="true"></span><span class="theme-clock"></span></button>
    <div class="theme-menu" id="theme-menu" role="group" aria-label="Time of day theme" hidden>
      <div class="theme-options" role="group" aria-label="Preview a scene">
        <button type="button" data-set-time="morning" aria-pressed="false" title="Morning · 朝">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Morning</span>
        </button>
        <button type="button" data-set-time="evening" aria-pressed="false" title="Evening · 夕暮れ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16h18M6 16a6 6 0 0 1 12 0M12 3v3M3 8l2 2m14 0 2-2M6 20h12"/></svg><span>Evening</span>
        </button>
        <button type="button" data-set-time="night" aria-pressed="false" title="Night · 夜">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/><path d="M18 3v4m-2-2h4"/></svg><span>Night</span>
        </button>
      </div>
      <div class="theme-meta"><button class="theme-auto" type="button" aria-pressed="true">Auto · Local</button></div>
    </div>
  </div>
  <span class="sr-only" id="theme-status" role="status" aria-live="polite"></span>
  <main id="main" class="post-shell">
    <a class="shrine-back" href="side-quests.html#reviews"><span aria-hidden="true">←</span> <span lang="ja">感想</span><span class="back-en"> / REVIEWS</span></a>
    <article class="post" aria-labelledby="post-title" aria-busy="true">
      <header class="post-head">
        <img class="post-cover" alt="" hidden>
        <div class="post-heading">
          <p class="post-kicker"></p>
          <h1 id="post-title"></h1>
          <p class="post-jp" lang="ja" hidden></p>
          <p class="post-lead" hidden></p>
        </div>
        <p class="post-mark" hidden></p>
      </header>
      <div class="post-body"></div>
      <section class="post-shots" aria-labelledby="post-shots-title" hidden>
        <h2 class="post-shots-title" id="post-shots-title"><span lang="ja">スクショ</span> Screenshots</h2>
        <ul class="shots-grid"></ul>
      </section>
      <p class="post-foot"><a class="shrine-back" href="side-quests.html#reviews"><span aria-hidden="true">←</span> <span lang="ja">感想</span><span class="back-en"> / REVIEWS</span></a></p>
    </article>
  </main>
  <dialog class="shot-viewer" aria-labelledby="shot-count">
    <figure class="shot-figure"><img class="shot-large" alt=""><figcaption class="shot-text" hidden></figcaption></figure>
    <p class="shot-count" id="shot-count"></p>
    <button class="shot-turn is-prev" type="button" aria-label="Previous screenshot">←</button>
    <button class="shot-turn is-next" type="button" aria-label="Next screenshot">→</button>
    <button class="shot-close" type="button" aria-label="Close screenshot" autofocus>×</button>
  </dialog>
  <script src="quest-data.js"></script>
  <script src="quest-post.js"></script>
  <span id="page-ready" hidden></span>
</body>
</html>
