<!doctype html>
<html lang="en" class="grounds">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ainkun — Security Researcher. Side Quests.">
  <meta name="theme-color" content="#c3daf5"><title>Side Quests | ainkun — Security Researcher</title>
  <script src="shrine.js"></script>
  <link rel="icon" href="assets/logo-clean/ainkun-clean.png?v=2" type="image/png"><link rel="stylesheet" href="shrine.css">
  <link rel="stylesheet" href="side-quests.css">
  <link rel="preload" as="image" href="assets/ema-rack.webp"><link rel="preload" as="image" href="assets/ema.webp">
  <link rel="expect" href="#page-ready" blocking="render">
</head>
<body data-state="scene">
  <div class="shrine-scene" aria-hidden="true"><div class="scene-plate"></div></div>
  <div class="theme-controls" hidden>
    <button class="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-menu"><span class="theme-now" aria-hidden="true"></span><span class="theme-clock"></span></button>
    <div class="theme-menu" id="theme-menu" role="group" aria-label="Time of day theme" hidden>
      <div class="theme-options" role="group" aria-label="Preview a scene">
        <button type="button" data-set-time="morning" aria-pressed="false" title="Morning · 朝">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Morning</span>
        </button>
        <button type="button" data-set-time="evening" aria-pressed="false" title="Evening · 夕暮れ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16h18M6 16a6 6 0 0 1 12 0M12 3v3M3 8l2 2m14 0 2-2M6 20h12"/></svg><span>Evening</span>
        </button>
        <button type="button" data-set-time="night" aria-pressed="false" title="Night · 夜">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/><path d="M18 3v4m-2-2h4"/></svg><span>Night</span>
        </button>
      </div>
      <div class="theme-meta"><button class="theme-auto" type="button" aria-pressed="true">Auto · Local</button></div>
    </div>
  </div>
  <span class="sr-only" id="theme-status" role="status" aria-live="polite"></span>
  <div class="shrine-particles" aria-hidden="true"></div>
  <main id="main">
    <nav class="grounds-way" aria-label="Way back">
      <a class="shrine-back" href="index.html" data-way="home"><span aria-hidden="true">←</span> <span lang="ja">帰り道</span><span class="back-en"> / BACK HOME</span></a>
      <button class="shrine-back" type="button" data-way="step" hidden><span aria-hidden="true">←</span> <span class="way-jp" lang="ja"></span><span class="back-en"></span></button>
    </nav>
    <section class="shrine-hero" aria-labelledby="side-quests-title">
      <div class="shrine-heading">
        <span class="shrine-pillar"><span lang="ja">寄り道神社</span></span>
        <div class="shrine-title">
          <p class="shrine-name">YORIMICHI SHRINE</p>
          <h1 id="side-quests-title">Side <em>Quests</em></h1>
        </div>
      </div>
    </section>
    <!-- The ema rack is painted into the scene. This box covers the painting exactly, so the button over the rack (and the
         close-up it opens) keep their place at every size. -->
    <div class="scene-stage">
      <button class="rack-spot" type="button" aria-expanded="false" aria-controls="quests" aria-label="Quest board"><span class="rack-gust" aria-hidden="true"></span><span class="rack-hint" aria-hidden="true"><span class="rack-label"><span lang="ja">絵馬掛所</span><small>QUEST BOARD</small></span></span></button>
      <section class="rack" id="quests" aria-labelledby="quest-board-title">
        <img class="rack-art" src="assets/ema-rack.webp" alt="" width="1052" height="952">
        <h2 class="rack-sign" id="quest-board-title"><span lang="ja">絵馬掛所</span> <small>QUEST BOARD</small></h2>
        <ul class="rack-ema" id="ema-grid" aria-busy="true"></ul>
      </section>
    </div>
    <section class="library" id="library" aria-labelledby="library-title" hidden>
      <div class="library-head">
        <h2 id="library-title" tabindex="-1"><span class="library-jp" lang="ja"></span><span class="library-name"></span></h2>
        <p class="library-count"></p>
      </div>
      <div class="library-body"></div>
    </section>
  </main>
  <script src="quest-data.js"></script>
  <script src="side-quests.js"></script>
  <span id="page-ready" hidden></span>
</body>
</html>
